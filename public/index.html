<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="navbar-container">
                <h1>🌤️ Weather Dashboard</h1>
                <div class="navbar-controls">
                    <button id="themeToggle" class="theme-btn">🌙</button>
                </div>
            </div>
        </nav>

        <main class="container">
            <!-- Search Section -->
            <section class="search-section">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="cityInput" 
                        placeholder="Search for a city..." 
                        autocomplete="off"
                    >
                    <button id="searchBtn" class="btn btn-primary">Search</button>
                </div>
                <div id="suggestions" class="suggestions-list"></div>
            </section>

            <!-- Current Weather -->
            <section id="currentWeather" class="weather-section hidden">
                <div class="weather-card">
                    <div class="weather-header">
                        <h2 id="locationName"></h2>
                        <p id="lastUpdated" class="text-muted"></p>
                    </div>
                    
                    <div class="weather-main">
                        <div class="weather-icon-large">
                            <img id="weatherIcon" src="" alt="Weather icon">
                        </div>
                        <div class="weather-info">
                            <div class="temperature">
                                <span id="currentTemp" class="temp-value">--°C</span>
                                <span id="weatherDesc" class="weather-description">--</span>
                            </div>
                            <p id="feelsLike" class="feels-like">Feels like --°C</p>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-item">
                            <span class="detail-label">💧 Humidity</span>
                            <span id="humidity" class="detail-value">--%</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">💨 Wind Speed</span>
                            <span id="windSpeed" class="detail-value">-- m/s</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">🌪️ Pressure</span>
                            <span id="pressure" class="detail-value">-- hPa</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">👁️ Visibility</span>
                            <span id="visibility" class="detail-value">-- km</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">🌅 Sunrise</span>
                            <span id="sunrise" class="detail-value">--:--</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">🌇 Sunset</span>
                            <span id="sunset" class="detail-value">--:--</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Forecast Section -->
            <section id="forecastSection" class="forecast-section hidden">
                <h3>5-Day Forecast</h3>
                <div id="forecastContainer" class="forecast-grid">
                    <!-- Forecast cards will be inserted here -->
                </div>
            </section>

            <!-- Error Message -->
            <section id="errorMessage" class="error-message hidden"></section>

            <!-- Loading State -->
            <section id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading weather data...</p>
            </section>
        </main>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
